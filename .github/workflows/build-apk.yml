name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web App
        run: pnpm --filter @workspace/hello-kitty-notes run build
        
      - name: Sync Capacitor
        run: |
          cd artifacts/hello-kitty-notes
          npx cap sync android
          
      - name: Build APK (Debug)
        run: |
          cd artifacts/hello-kitty-notes/android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hello-Kitty-Notes.apk
          path: artifacts/hello-kitty-notes/android/app/build/outputs/apk/debug/app-debug.apk
